# Reusable workflow for scanning Agent Skills with cisco-ai-skill-scanner.
#
# Usage – add this to your repo's .github/workflows/ directory:
#
#   jobs:
#     scan:
#       uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@2.2.1
#       with:
#         skill_path: .cursor/skills
#         scanner_version: "2.2.1"
#         use_llm: true
#         llm_model: claude-sonnet-5-5
#       secrets:
#         llm_api_key: ${{ secrets.SKILL_SCANNER_LLM_API_KEY }}
#
# The runner checks out YOUR repo, installs skill-scanner from PyPI, and runs
# the CLI on your code.  Our repo is never cloned – GitHub reads this YAML to
# know what steps to execute.  Pin both the workflow ref and scanner_version to
# the same release so the presets and flags match the docs for that release.

name: Scan Agent Skills

on:
  workflow_call:
    inputs:
      scanner_version:
        description: "skill-scanner version to install from PyPI, for example 2.2.0 (empty installs the latest release). Pin to match the docs"
        required: false
        type: string
        default: ""
      skill_path:
        description: "Path to a single skill directory, or a parent directory for scan-all"
        required: true
        type: string
      format:
        description: "Output format (summary, json, markdown, table, sarif, html)"
        required: false
        type: string
        default: "sarif"
      policy:
        description: "Scan policy preset (balanced, low-noise, quiet, strict, permissive) or path to custom YAML. low-noise and quiet are measured with the LLM judge (use_llm)"
        required: false
        type: string
        default: "balanced"
      fail_on_severity:
        description: "Exit non-zero if findings at or above this severity exist"
        required: false
        type: string
        default: "high"
      python_version:
        description: "CPython version to use (3.11 through 3.14, numeric versions only)"
        required: false
        type: string
        default: "3.12"
      upload_sarif:
        description: "Upload SARIF results to GitHub Code Scanning"
        required: false
        type: boolean
        default: true
      use_llm:
        description: "Enable the LLM judge (recommended; needs the llm_api_key secret, which can be a Bedrock API key)"
        required: false
        type: boolean
        default: false
      llm_model:
        description: "LLM model to use (maps to SKILL_SCANNER_LLM_MODEL, e.g. claude-sonnet-5-5 or bedrock/us.anthropic.claude-sonnet-5-5)"
        required: false
        type: string
        default: ""
      llm_provider:
        description: "Optional LLM provider (maps to SKILL_SCANNER_LLM_PROVIDER, e.g. openai-compatible for a gateway)"
        required: false
        type: string
        default: ""
      llm_base_url:
        description: "Optional LLM endpoint base URL (maps to SKILL_SCANNER_LLM_BASE_URL)"
        required: false
        type: string
        default: ""
      aws_region:
        description: "AWS region for bedrock/ models (maps to AWS_REGION)"
        required: false
        type: string
        default: "us-east-1"
      use_behavioral:
        description: "Enable behavioral dataflow analysis"
        required: false
        type: boolean
        default: false
      lenient:
        description: "Tolerate malformed skills instead of failing"
        required: false
        type: boolean
        default: false
      scan_mode:
        description: "scan (single skill) or scan-all (directory of skills)"
        required: false
        type: string
        default: "scan-all"
      extra_args:
        description: "Additional validated CLI arguments from the workflow allowlist"
        required: false
        type: string
        default: ""
    secrets:
      llm_api_key:
        description: "API key for LLM provider (maps to SKILL_SCANNER_LLM_API_KEY)"
        required: false
      virustotal_api_key:
        description: "VirusTotal API key (maps to VIRUSTOTAL_API_KEY)"
        required: false

jobs:
  scan:
    name: Skill Scanner
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Validate supported Python version
        env:
          INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          if [[ ! "$INPUT_PYTHON_VERSION" =~ ^3\.([0-9]+)(\.[0-9]+)?$ ]]; then
            echo "::error::python_version must be a numeric CPython 3.x version (for example, 3.11 or 3.14.1)"
            exit 1
          fi
          if (( 10#${BASH_REMATCH[1]} < 11 )); then
            echo "::error::python_version must be 3.11 or newer"
            exit 1
          fi
          if (( 10#${BASH_REMATCH[1]} > 14 )); then
            echo "::error::python_version must be 3.14 or older (supported range: 3.11 through 3.14)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install skill-scanner
        env:
          INPUT_LLM_MODEL: ${{ inputs.llm_model }}
          INPUT_SCANNER_VERSION: ${{ inputs.scanner_version }}
        run: |
          VERSION_SPEC=""
          if [ -n "$INPUT_SCANNER_VERSION" ]; then
            if [[ ! "$INPUT_SCANNER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)$ ]]; then
              echo "::error::scanner_version must be a release version such as 2.2.0"
              exit 1
            fi
            VERSION_SPEC="==${INPUT_SCANNER_VERSION}"
          fi
          EXTRAS=""
          case "$INPUT_LLM_MODEL" in
            bedrock/*|bedrock-mantle/*)
              EXTRAS="[bedrock]"
              ;;
            gemini/*|*gemini*)
              EXTRAS="[google]"
              ;;
            vertex_ai/*|vertex/*|*vertex*)
              EXTRAS="[vertex]"
              ;;
          esac
          pip install "cisco-ai-skill-scanner${EXTRAS}${VERSION_SPEC}"
          skill-scanner --version

      - name: Validate inputs
        env:
          INPUT_SCAN_MODE: ${{ inputs.scan_mode }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_POLICY: ${{ inputs.policy }}
          INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
        run: |
          fail=0
          case "$INPUT_SCAN_MODE" in
            scan|scan-all) ;;
            *) echo "::error::Invalid scan_mode: must be 'scan' or 'scan-all'"; fail=1 ;;
          esac
          case "$INPUT_FORMAT" in
            summary|json|markdown|table|sarif|html) ;;
            *) echo "::error::Invalid format: must be summary, json, markdown, table, sarif, or html"; fail=1 ;;
          esac
          case "$INPUT_POLICY" in
            strict|balanced|permissive|low-noise|quiet) ;;
            *)
              if [ ! -f "$INPUT_POLICY" ]; then
                echo "::error::Invalid policy: must be a preset (strict, balanced, permissive, low-noise, quiet) or a path to an existing YAML file"
                fail=1
              fi
              ;;
          esac
          case "$INPUT_FAIL_ON_SEVERITY" in
            critical|high|medium|low|info) ;;
            *) echo "::error::Invalid fail_on_severity: must be critical, high, medium, low, or info"; fail=1 ;;
          esac
          exit "$fail"

      - name: Run scan
        env:
          SKILL_SCANNER_LLM_API_KEY: ${{ secrets.llm_api_key }}
          SKILL_SCANNER_LLM_MODEL: ${{ inputs.llm_model }}
          SKILL_SCANNER_LLM_PROVIDER: ${{ inputs.llm_provider }}
          SKILL_SCANNER_LLM_BASE_URL: ${{ inputs.llm_base_url }}
          AWS_REGION: ${{ inputs.aws_region }}
          VIRUSTOTAL_API_KEY: ${{ secrets.virustotal_api_key }}
          INPUT_SCAN_MODE: ${{ inputs.scan_mode }}
          INPUT_SKILL_PATH: ${{ inputs.skill_path }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_POLICY: ${{ inputs.policy }}
          INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
          INPUT_USE_LLM: ${{ inputs.use_llm }}
          INPUT_USE_BEHAVIORAL: ${{ inputs.use_behavioral }}
          INPUT_LENIENT: ${{ inputs.lenient }}
          INPUT_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set +e

          python - <<'PY'
          import os
          import shlex
          import subprocess
          import sys

          value_flags = {
              "--llm-provider": {
                  "anthropic",
                  "openai",
                  "openai-compatible",
                  "aws-bedrock",
                  "gcp-vertex",
                  "azure-openai",
                  "azure-ai",
                  "openrouter",
              },
              "--llm-consensus-runs": "int",
              "--llm-max-tokens": "int",
              "--skill-file": "path",
              "--custom-rules": "path",
              "--taxonomy": "path",
              "--threat-mapping": "path",
          }
          bool_flags = {
              "--use-virustotal",
              "--vt-upload-files",
              "--use-aidefense",
              "--use-trigger",
              "--enable-meta",
              "--llm-decompose",
              "--use-osv",
              "--adjudicate",
              "--detailed",
              "--render-markdown",
              "--no-render-markdown",
              "--compact",
              "--verbose",
              "--fail-on-findings",
          }

          def validate_path(value: str) -> bool:
              return bool(value) and "\n" not in value and "\r" not in value and "\x00" not in value

          def validate_extra_args(raw: str) -> list[str]:
              tokens = shlex.split(raw or "")
              args: list[str] = []
              i = 0
              while i < len(tokens):
                  token = tokens[i]
                  if token in bool_flags:
                      args.append(token)
                      i += 1
                      continue
                  if token == "--rule-packs":
                      args.append(token)
                      i += 1
                      if i >= len(tokens) or tokens[i].startswith("-"):
                          raise SystemExit("::error::--rule-packs requires at least one pack name")
                      while i < len(tokens) and not tokens[i].startswith("-"):
                          if not tokens[i].replace("-", "").replace("_", "").isalnum():
                              raise SystemExit(f"::error::Invalid rule pack name: {tokens[i]}")
                          args.append(tokens[i])
                          i += 1
                      continue
                  if token in value_flags:
                      if i + 1 >= len(tokens):
                          raise SystemExit(f"::error::{token} requires a value")
                      value = tokens[i + 1]
                      validator = value_flags[token]
                      if validator == "int":
                          if not value.isdigit() or int(value) < 1:
                              raise SystemExit(f"::error::{token} requires a positive integer")
                      elif isinstance(validator, set):
                          if value not in validator:
                              allowed = ", ".join(sorted(validator))
                              raise SystemExit(f"::error::{token} must be one of: {allowed}")
                      elif not validate_path(value):
                          raise SystemExit(f"::error::{token} contains an invalid path value")
                      args.extend([token, value])
                      i += 2
                      continue
                  raise SystemExit(f"::error::Unsupported extra_args token: {token}")
              return args

          cmd = ["skill-scanner", os.environ["INPUT_SCAN_MODE"], os.environ["INPUT_SKILL_PATH"]]
          cmd += ["--format", os.environ["INPUT_FORMAT"], "--policy", os.environ["INPUT_POLICY"]]

          if os.environ["INPUT_SCAN_MODE"] == "scan-all":
              cmd += ["--recursive", "--check-overlap"]
          if os.environ["INPUT_USE_LLM"] == "true":
              cmd.append("--use-llm")
          if os.environ["INPUT_USE_BEHAVIORAL"] == "true":
              cmd.append("--use-behavioral")
          if os.environ["INPUT_LENIENT"] == "true":
              cmd.append("--lenient")
          if os.environ["INPUT_FORMAT"] == "sarif":
              cmd += ["--output", "results.sarif"]

          cmd += ["--fail-on-severity", os.environ["INPUT_FAIL_ON_SEVERITY"]]
          cmd += validate_extra_args(os.environ.get("INPUT_EXTRA_ARGS", ""))

          print("Running:", shlex.join(cmd))
          result = subprocess.run(cmd, check=False)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"scan_exit_code={result.returncode}\n")
          sys.exit(0)
          PY
          exit 0

      - name: Upload SARIF to Code Scanning
        if: inputs.upload_sarif && inputs.format == 'sarif' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Check severity threshold
        env:
          INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail_on_severity }}
          INPUT_FORMAT: ${{ inputs.format }}
        run: |
          if [ "$scan_exit_code" = "0" ]; then
            exit 0
          fi
          # Exit 2 means the scan could not be configured as requested (an unknown
          # policy, or an LLM judge that could not be built); a SARIF run that wrote
          # no results file also never got as far as scanning.
          if [ "$scan_exit_code" = "2" ] || { [ "$INPUT_FORMAT" = "sarif" ] && [ ! -s results.sarif ]; }; then
            echo "::error::Skill Scanner could not run as configured (exit $scan_exit_code); see the Run scan step log"
            exit 1
          fi
          echo "::error::Skill Scanner found findings at or above $INPUT_FAIL_ON_SEVERITY severity"
          exit 1
