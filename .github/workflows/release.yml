name: "Publish to PyPI"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match a git tag, e.g., 0.2.1)'
        required: true
        type: string
      corpus_artifact_run_id:
        description: 'Successful detection-release-evidence workflow run dispatched from the exact release tag'
        required: true
        type: string
      public_corpus_artifact:
        description: 'Must be detection-release-evidence-<full release commit SHA>'
        required: true
        type: string
      private_corpus_artifact:
        description: 'Optional nonblocking private/source-disjoint evidence artifact from the same run'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve immutable release revision
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact tag commit
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.version }}
        run: |
          if ! git check-ref-format "refs/tags/$RELEASE_REF" >/dev/null; then
            echo "::error::version must be a valid exact git tag"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_REF"; then
            echo "::error::release tag does not exist: $RELEASE_REF"
            exit 1
          fi
          release_sha="$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release tag did not resolve to a full lowercase commit SHA"
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  release-detection-gates:
    name: Mandatory same-revision detection gates
    needs: resolve-release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/detection-release-gates.yml
    with:
      release_ref: ${{ inputs.version }}
      release_sha: ${{ needs.resolve-release.outputs.release_sha }}
      corpus_artifact_run_id: ${{ inputs.corpus_artifact_run_id }}
      public_corpus_artifact: ${{ inputs.public_corpus_artifact }}
      private_corpus_artifact: ${{ inputs.private_corpus_artifact }}
    secrets: inherit

  build-platform-wheels:
    name: Build and smoke ${{ matrix.target }} wheel
    needs:
      - resolve-release
      - release-detection-gates
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-26-intel
          - target: darwin-arm64
            runner: macos-26
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.7.0

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install qualified Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/cel_runtime/go.sum

      - name: Test CEL helper
        working-directory: tools/cel_runtime
        run: go test ./...

      - name: Build exact platform wheel
        env:
          SKILL_SCANNER_CEL_GO_TARGET: ${{ matrix.target }}
        run: uv build --wheel --out-dir dist

      - name: Verify wheel tag, manifest, architecture, and native execution
        run: >-
          uv run python scripts/verify_cel_wheel.py
          --wheel-dir dist
          --target ${{ matrix.target }}
          --project-version ${{ inputs.version }}
          --smoke

      - name: Install, import, and validate the exact built wheel
        run: >-
          python scripts/smoke_cel_wheel_install.py
          --wheel-dir dist
          --expected-python 3.12

      - name: Upload platform wheel
        uses: actions/upload-artifact@v4
        with:
          name: skill-scanner-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    name: Upload release to PyPI
    needs:
      - resolve-release
      - release-detection-gates
      - build-platform-wheels
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment:
      name: pypi
      url: https://pypi.org/p/cisco-ai-skill-scanner
    permissions:
      id-token: write
      contents: write  # needed to create/update the GitHub release assets
      attestations: write  # needed to store build provenance and SBOM attestations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6.7.0

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install qualified Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: tools/cel_runtime/go.sum

      - name: Download verified platform wheels
        uses: actions/download-artifact@v4
        with:
          pattern: skill-scanner-wheel-*
          path: dist
          merge-multiple: true

      - name: Build source distribution for Homebrew and source consumers
        run: uv build --sdist --out-dir dist

      - name: Verify complete wheel matrix
        run: |
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            uv run python scripts/verify_cel_wheel.py \
              --wheel-dir dist \
              --target "$target" \
              --project-version "${{ inputs.version }}"
          done
          test "$(find dist -maxdepth 1 -name '*.whl' -type f | wc -l | tr -d ' ')" = 5
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')" = 1

      - name: Clean-install sdist with exact prebuilt helper and validate rules
        run: >-
          uv run --no-sync python scripts/smoke_cel_sdist_install.py
          --sdist-dir dist
          --wheel-dir dist
          --target linux-amd64
          --expected-python 3.12

      # Export a hash-pinned requirements.txt so plain `pip` users can reproduce
      # the same locked tree without needing uv. Kept outside dist/ so the PyPI
      # publish step doesn't try to upload it as a distribution.
      - name: Export hash-pinned requirements.txt
        run: |
          mkdir -p release-assets
          uv export \
            --frozen \
            --no-dev \
            --all-extras \
            --no-emit-project \
            --output-file release-assets/requirements.txt

      # SBOM is generated from the frozen export above so all release artifacts
      # describe one locked tree. The project version is dynamic (VCS-derived),
      # so it is stamped from the workflow input.
      - name: Generate CycloneDX SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv sync --frozen --only-group sbom
          # --output-reproducible omits the serialNumber required by actions/attest.
          uv run --no-sync cyclonedx-py requirements \
            release-assets/requirements.txt \
            --output-file release-assets/sbom.cdx.json \
            2>"$RUNNER_TEMP/cyclonedx-stderr.txt"
          if [[ -s "$RUNNER_TEMP/cyclonedx-stderr.txt" ]]; then
            cat "$RUNNER_TEMP/cyclonedx-stderr.txt"
            exit 1
          fi
          uv run --no-sync python scripts/export_cel_supply_chain.py \
            --wheel-dir dist \
            --sbom release-assets/sbom.cdx.json \
            --dependency-lock release-assets/cel-go-dependencies.json \
            --helper-manifest release-assets/cel-go-helpers.json \
            --pyproject pyproject.toml \
            --project-version "$VERSION"
          jq -e \
            '.bomFormat == "CycloneDX"
             and (.serialNumber | type == "string" and length > 0)
             and (.specVersion | type == "string" and length > 0)
             and (.metadata.component["bom-ref"] == .metadata.component.purl)
             and ([.components[] | select(.purl | startswith("pkg:pypi/"))] | length > 0)
             and ([.components[] | select(.name == "go-toolchain" and .version == "1.27.1")] | length == 1)
             and ([.components[] | select(.name == "cel.dev/cel-go" and .version == "v0.32.0")] | length == 1)
             and ([.components[] | select(.name == "skill-scanner-cel-go")] | length == 5)
             and (.metadata.component["bom-ref"] as $root
                  | ([.components[] | select((.purl | startswith("pkg:pypi/")) or .name == "skill-scanner-cel-go") | .["bom-ref"]] | sort) as $expected
                  | ([.dependencies[] | select(.ref == $root) | .dependsOn][0] | sort) == $expected)' \
            release-assets/sbom.cdx.json >/dev/null

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*
            release-assets/*

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*
          sbom-path: release-assets/sbom.cdx.json

      - name: Check GitHub release state
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$VERSION" --json isDraft --jq '.isDraft' >/tmp/release-is-draft; then
            is_draft="$(</tmp/release-is-draft)"
            if [[ "$is_draft" == "false" ]]; then
              published=true
              echo "::warning::GitHub release $VERSION is already published. Immutable releases cannot accept new assets, so release asset upload will be skipped."
            else
              published=false
            fi
            {
              echo "exists=true"
              echo "draft=$is_draft"
              echo "published=$published"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "exists=false"
              echo "draft=false"
              echo "published=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Attach requirements.txt and SBOM to draft GitHub release
        if: steps.release-state.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            release-assets/requirements.txt
            release-assets/sbom.cdx.json
            release-assets/cel-go-dependencies.json
            release-assets/cel-go-helpers.json
          fail_on_unmatched_files: true
          draft: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish GitHub release
        if: steps.release-state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "$VERSION" --draft=false
