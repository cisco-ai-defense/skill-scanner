# Authoritative bundled rule-pack manifest. Implementations are validated
# atomically against this schema-v2 identity at scanner startup.
schema_version: 2
name: atr
version: 3.5.6
description: 'Open-source AI agent security detection rules from the Agent Threat Rules (ATR) project. 712 supported static
  rules across 10 attack categories: prompt injection, agent manipulation, skill compromise, context exfiltration, tool poisoning,
  privilege escalation, model abuse, excessive autonomy, data poisoning, and model security. Benchmark results are published
  upstream in the ATR benchmark table, version-pinned per measurement; see the pack README for the figures that apply to this
  ruleset and their caveats. MIT license.'
