# ATR (Agent Threat Rules) Rule Pack for Cisco Skill Scanner
# Source: https://github.com/Agent-Threat-Rule/agent-threat-rules
# Version: 3.5.6
# Supported ATR static ruleset: 712 rules across 10 attack categories.
# MIT License. Auto-indexed from 10 category signature files.

pack:
  id: atr
  name: ATR Agent Threat Rules
  version: 3.5.6
  description: >-
    Open-source AI agent security detection rules from the Agent Threat Rules (ATR) project. 712 supported static rules across 10 attack categories: prompt injection, agent manipulation, skill compromise, context exfiltration, tool poisoning, privilege escalation, model abuse, excessive autonomy, data poisoning, and model security. Benchmarks: 97.2% recall on NVIDIA garak 650 in-the-wild jailbreaks, 100% recall on 498 labeled SKILL.md samples, 99.7% precision on 850 PINT adversarial samples. OWASP Agentic Top 10: 10/10. MIT license.
  author: ATR Community
  license: MIT
  source_url: https://github.com/Agent-Threat-Rule/agent-threat-rules
  signature_files:
    - signatures/atr_agent_manipulation.yaml
    - signatures/atr_context_exfiltration.yaml
    - signatures/atr_data_poisoning.yaml
    - signatures/atr_excessive_autonomy.yaml
    - signatures/atr_model_abuse.yaml
    - signatures/atr_model_security.yaml
    - signatures/atr_privilege_escalation.yaml
    - signatures/atr_prompt_injection.yaml
    - signatures/atr_skill_compromise.yaml
    - signatures/atr_tool_poisoning.yaml
