  - id: ATR_2026_01896
    atr_id: ATR-2026-01896
    atr_url: >-
      https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/model-abuse/ATR-2026-01896-ransomware.yaml
    category: model_abuse
    severity: CRITICAL
    patterns:
      - >-
        (?i)requests\.get\([\"'][^\"'\n]{0,80}get_key[^\"'\n]{0,10}[\"']\)\.content
    file_types: *id001
    description: >-
      Detects injected code that fetches an encryption key from a remote server (requests.get(.../get_key).content) and encrypts a victim file in place with Fernet/AES/ChaCha20/Blowfish — the defining shape of ransomware. The remote-key + in-place-encrypt pair is the invariant.
    remediation: ''
  - id: ATR_2026_01897
    atr_id: ATR-2026-01897
    atr_url: >-
      https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/model-abuse/ATR-2026-01897-host-sabotage.yaml
    category: model_abuse
    severity: CRITICAL
    patterns:
      - (?i)shutil\.rmtree\(\s*[\"']/[\"']\s*\)
      - >-
        (?i)os\.remove\(\s*[\"']/(?:lib|bin|etc|boot|usr)/[^\"'\n]{0,40}[\"']\)
      - (?i)while\s+True\s*:\s*\n?\s*os\.fork\(\)
      - (?i)open\(\s*[\"']/etc/hosts[\"']\s*,\s*[\"']a[\"']\)
      - (?i)while\s+True\s*:[\s\S]{0,60}[\"']x[\"']\s*\*\s*\d{6,}
      - (?i)while\s+True\s*:\s*\n?\s*create_window\(\)
    file_types: *id001
    description: >-
      Detects injected code that sabotages the local host: recursive root deletion (shutil.rmtree('/')), removal of critical system binaries (libc), fork bombs, megabyte-string memory bombs in an infinite loop, infinite window spawning, or DNS hijack by appending to /etc/hosts.
    remediation: ''
  - id: ATR_2026_01898
    atr_id: ATR-2026-01898
    atr_url: >-
      https://github.com/Agent-Threat-Rule/agent-threat-rules/blob/main/rules/model-abuse/ATR-2026-01898-network-dos.yaml
    category: model_abuse
    severity: HIGH
    patterns:
      - >-
        (?i)for\s+conn\s+in\s+psutil\.net_connections\(\)[\s\S]{0,80}\.terminate\(\)
      - (?i)Win32_NetworkAdapterConfiguration\([\s\S]{0,60}\.Disable\(\)
      - >-
        (?i)while\s+True\s*:[\s\S]{0,80}requests\.get\([^\n]{0,40}\btimeout\s*=\s*1\b
      - (?i)while\s+True\s*:[\s\S]{0,80}TCP\(dport=\d+,\s*flags=[\"']S[\"']
    file_types: *id001
    description: >-
      Detects injected code that disrupts connectivity: terminating every process owning a network connection, disabling network adapters via WMI, an unbounded request-flood loop, or a scapy SYN flood against a target.
    remediation: ''
